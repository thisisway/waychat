# Infra de desenvolvimento. Uso: cp .env.example .env && docker compose -f infra/docker/compose.dev.yml --env-file .env up -d
# Todas as portas escutam só em 127.0.0.1.
name: waychat-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: waychat
      POSTGRES_USER: waychat_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?defina POSTGRES_OWNER_PASSWORD no .env}
      WAYCHAT_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?defina POSTGRES_APP_PASSWORD no .env}
      WAYCHAT_RELAY_PASSWORD: ${POSTGRES_RELAY_PASSWORD:?defina POSTGRES_RELAY_PASSWORD no .env}
    ports: ['127.0.0.1:5462:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waychat_owner -d waychat']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8
    command:
      [
        'valkey-server',
        '--requirepass',
        '${VALKEY_PASSWORD:?defina VALKEY_PASSWORD no .env}',
        '--appendonly',
        'yes',
      ]
    ports: ['127.0.0.1:6409:6379']
    volumes: [valkeydata:/data]
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  minio:
    # fork mantido do MinIO: o repositório minio/minio saiu do Docker Hub
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    ports: ['127.0.0.1:9030:9000', '127.0.0.1:9031:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Antivírus dos anexos. Pesado (baixa as assinaturas na primeira subida): só com `--profile antivirus`.
  # Sem ele, em desenvolvimento os anexos passam sem varredura (CLAMAV_HOST vazio no .env).
  clamav:
    image: clamav/clamav:stable
    profiles: ['antivirus']
    ports: ['127.0.0.1:3310:3310']
    volumes: [clamdata:/var/lib/clamav]
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  pgdata:
  valkeydata:
  miniodata:
  clamdata:
