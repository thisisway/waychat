name: CI

on:
  push:
    branches: [main, 'fase-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versão vem do campo packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Os testes usam Testcontainers (Postgres e Valkey reais); o runner já tem Docker.
      - run: pnpm test
      - name: Auditoria de dependências
        run: pnpm audit --audit-level=high

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Análise estática (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/typescript --config p/nodejs --config p/owasp-top-ten --error --metrics off --exclude '**/*.test.ts' .

  images:
    name: Imagens Docker + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f infra/docker/node.Dockerfile --target ${{ matrix.app }} --build-arg APP=${{ matrix.app }} -t waychat-${{ matrix.app }}:ci .
      - name: Trivy (HIGH e CRITICAL falham o build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: waychat-${{ matrix.app }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
