name: CI

on:
  push:
    branches: [main, 'fase-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 # versão vem do campo packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build primeiro: o ESLint com regras de tipo lê os .d.ts gerados dos pacotes internos
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # Os testes usam Testcontainers (Postgres e Valkey reais); o runner já tem Docker.
      - run: pnpm test
      - name: Auditoria de dependências
        run: pnpm audit --audit-level=high

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Análise estática (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # minimumReleaseAge do pnpm está em 1 dia (o lockfile atual tem versões recentes); regra exige 7 — ver docs/backlog.md
      - run: semgrep scan --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age --config p/typescript --config p/nodejs --config p/owasp-top-ten --error --metrics off --exclude '**/*.test.ts' .

  images:
    name: Imagens Docker + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -f infra/docker/node.Dockerfile --target ${{ matrix.app }} --build-arg APP=${{ matrix.app }} -t waychat-${{ matrix.app }}:ci .
      - name: Trivy (HIGH e CRITICAL falham o build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest             image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 waychat-${{ matrix.app }}:ci
